  <rect width="512" height="512" fill="url(#sky)"/>
  <circle cx="344" cy="166" r="118" fill="url(#glow)"/>
  <circle cx="344" cy="166" r="56" fill="url(#sun)"/>
  <!-- Rock of Gibraltar seen from the Bay: sheer north face on the left, long ridge falling south to Europa Point -->
