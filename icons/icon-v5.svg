  <path d="M176 140 L198 154 L220 148 L248 172 L284 182 L318 212 L356 244 L392 284 L424 326 L444 372" fill="none" stroke="#fff6e3" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" opacity="0.7"/>
  <!-- Sea -->
  <rect y="366" width="512" height="146" fill="url(#sea)"/>
  <path d="M88 410 q 26 -12 52 0 t 52 0 t 52 0 t 52 0 t 52 0 t 52 0" fill="none" stroke="#bfe6fb" stroke-width="8" stroke-linecap="round" opacity="0.8"/>
