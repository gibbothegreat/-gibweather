      <stop offset="1" stop-color="#8d7452"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1679b3"/>
      <stop offset="1" stop-color="#063a63"/>
