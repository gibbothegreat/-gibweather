name: Upgrade GibWeather v1.9

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/upgrade-v19.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply v1.9 upgrade
        run: python3 scripts/upgrade_v19.py

      - name: Validate v1.9 release
        run: python3 scripts/validate_release.py

      - name: Publish v1.9
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "GibWeather v1.9 is already applied."
          else
            git commit -m "release: GibWeather v1.9 airport verification detail"
            git pull --rebase origin main
            git push origin main
          fi
