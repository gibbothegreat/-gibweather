name: Background alerts

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      test:
        description: 'Send a test notification now, whatever the forecast'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: background-alerts
  cancel-in-progress: false

jobs:
  alerts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Web Push library
        run: npm install --no-save --no-package-lock web-push@3
      - name: Check forecast and send alerts
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
          PUSH_TEST: ${{ inputs.test }}
        run: node scripts/send_push_alerts.js
      - name: Save alert state
        shell: bash
        run: |
          if git diff --quiet -- data/push-state.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/push-state.json
          git commit -m "chore: update background alert state"
          git pull --rebase origin main
          git push
