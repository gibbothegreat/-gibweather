name: Deploy GibWeather v1.4 package

on:
  push:
    branches: [main]
    paths:
      - '.deploy/v14/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Rebuild and deploy v1.4 when corrected package is complete
        shell: bash
        run: |
          set -euo pipefail
          files=(
            .deploy/v14/part-00
            .deploy/v14/part-01
            .deploy/v14/part-02
            .deploy/v14/part-03
            .deploy/v14/part-04
            .deploy/v14/fix-05a
            .deploy/v14/fix-05b0.hex
            .deploy/v14/fix-05b1.hex
            .deploy/v14/part-06
            .deploy/v14/part-07
            .deploy/v14/fix-08-0.hex
            .deploy/v14/fix-08-1.hex
            .deploy/v14/fix-08-2.hex
            .deploy/v14/fix-08-3.hex
            .deploy/v14/part-09
          )
          for f in "${files[@]}"; do
            if [ ! -f "$f" ]; then
              echo "Package correction incomplete: missing $f"
              exit 0
            fi
          done

          cat .deploy/v14/fix-05b0.hex .deploy/v14/fix-05b1.hex | xxd -r -p > /tmp/fix-05b
          cat .deploy/v14/fix-08-0.hex .deploy/v14/fix-08-1.hex .deploy/v14/fix-08-2.hex .deploy/v14/fix-08-3.hex | xxd -r -p > /tmp/fix-08

          cat \
            .deploy/v14/part-00 \
            .deploy/v14/part-01 \
            .deploy/v14/part-02 \
            .deploy/v14/part-03 \
            .deploy/v14/part-04 \
            .deploy/v14/fix-05a \
            /tmp/fix-05b \
            .deploy/v14/part-06 \
            .deploy/v14/part-07 \
            /tmp/fix-08 \
            .deploy/v14/part-09 \
            | base64 -d > /tmp/gibweather-v1.4.zip

          unzip -t /tmp/gibweather-v1.4.zip
          rm -rf /tmp/gibweather-v1.4
          mkdir -p /tmp/gibweather-v1.4
          unzip -oq /tmp/gibweather-v1.4.zip -d /tmp/gibweather-v1.4
          cp -a /tmp/gibweather-v1.4/. ./
          rm -rf .deploy/v14

          python3 scripts/validate_release.py
          node --check app.js
          node --check service-worker.js

          # The Actions token cannot modify workflow files. The LXGB updater
          # is added separately after this validated app deployment.
          rm -f .github/workflows/update-lxgb-observation.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No deployment changes to commit.'
            exit 0
          fi
          git commit -m 'Deploy GibWeather v1.4'
          git push
